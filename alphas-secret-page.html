<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Coordinate Finder</title><link rel="stylesheet" href="map.css">
<style>
#tool{left:14px;bottom:14px;width:340px;max-width:calc(100% - 28px);background:rgba(14,24,38,.96);border:1px solid #2e4259;border-radius:10px;padding:12px;z-index:30}
#tool h3{margin:0 0 8px;font-size:14px}
.row{display:flex;gap:6px;align-items:center;margin-bottom:5px;font:13px ui-monospace,Consolas,monospace}
.row span{flex:1}
.row em{font-style:normal;color:#8da0b6;width:60px;font-family:system-ui}
#tool button{background:#1c3047;color:#fff;border:1px solid #2e4259;border-radius:6px;padding:4px 9px;cursor:pointer;font-size:12px}
#tool button:hover{background:#27425f}
#tool button.big{width:100%;margin-top:4px;padding:7px}
#tool button.ok{background:#1f6b3a}
textarea{width:100%;height:90px;margin-top:8px;background:#0a1320;color:#cfe1f5;border:1px solid #2e4259;border-radius:6px;font:12px ui-monospace,Consolas,monospace;padding:6px;resize:vertical}
.hint{color:#8da0b6;font-size:12px;margin:0 0 8px}
.coords{left:auto;right:62px;bottom:auto;top:14px}
.compass{display:none}
#tool{bottom:14px}
.marker.sel .dot{background:#ff3b3b;width:12px;height:12px}
.marker.sel::before,.marker.sel::after{content:'';position:absolute;background:#ff3b3b;transform:scale(var(--inv,1))}
.marker.sel::before{left:-20px;top:-1px;width:40px;height:2px}
.marker.sel::after{top:-20px;left:-1px;height:40px;width:2px}
</style>
</head><body>
<div id="map"></div>
<div class="ui btns"><button id="zin">+</button><button id="zout">−</button><button id="reset">⟲</button></div>
<div class="ui coords" id="coords">X: --, Z: --</div>

<div class="ui" id="tool">
  <h3>Coordinate Finder</h3>
  <p class="hint">Click the map to pick a spot. Existing points from locations.js are shown in their colours.</p>
  <div class="row"><em>X</em><span id="vx">—</span><button data-copy="vx">Copy</button></div>
  <div class="row"><em>Z</em><span id="vz">—</span><button data-copy="vz">Copy</button></div>
  <div class="row"><em>Pixel</em><span id="vp">—</span><button data-copy="vp">Copy</button></div>
  <div class="row"><em>Percent</em><span id="vpc">—</span><button data-copy="vpc">Copy</button></div>
  <button class="big" id="copyAll">Copy all</button>
  <button class="big" id="copySnip">Copy as location line</button>
  <button class="big" id="addList">Add to list below</button>
  <textarea id="list" placeholder="Added locations appear here, ready to paste into locations.js" spellcheck="false"></textarea>
  <button class="big" id="copyList">Copy list</button>
</div>

<script src="locations.js"></script>
<script src="map.js"></script>
<script>
const $ = id => document.getElementById(id);
let sel = null, selMarker = null;

const map = createMap($('map'), {
  onClick: p => {
    sel = p;
    if (selMarker) selMarker.remove();
    selMarker = map.addMarker(p.x, p.z, '#ff3b3b', '', undefined, 'sel');
    $('vx').textContent = Math.round(p.x);
    $('vz').textContent = Math.round(p.z);
    $('vp').textContent = `${p.px.toFixed(1)}, ${p.py.toFixed(1)}`;
    $('vpc').textContent = `${(p.px / MAP_CONFIG.width * 100).toFixed(2)}%, ${(p.py / MAP_CONFIG.height * 100).toFixed(2)}%`;
  },
  onMove: p => $('coords').textContent = p ? `X: ${Math.round(p.x)}, Z: ${Math.round(p.z)}` : 'X: --, Z: --'
});
LOCATIONS.forEach(l => map.addMarker(l.x, l.z, (CATEGORIES[l.type] || {color:'#fff'}).color, l.name));

function flash(btn) { const t = btn.textContent; btn.classList.add('ok'); btn.textContent = 'Copied!'; setTimeout(() => { btn.classList.remove('ok'); btn.textContent = t; }, 900); }
function copy(text, btn) {
  const done = () => flash(btn);
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, () => fallback(text, done));
  else fallback(text, done);
}
function fallback(text, done) {
  const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select();
  try { document.execCommand('copy'); done(); } catch (e) {} t.remove();
}
const need = () => { if (!sel) { alert('Click the map first.'); return false; } return true; };
const snippet = () => `  { name: 'New place', type: 'city', x: ${Math.round(sel.x)}, z: ${Math.round(sel.z)}, owner: '', description: '' },`;

document.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => { if (need()) copy($(b.dataset.copy).textContent, b); });
$('copyAll').onclick = e => need() && copy(`X: ${Math.round(sel.x)}, Z: ${Math.round(sel.z)} | pixel ${$('vp').textContent} | ${$('vpc').textContent}`, e.target);
$('copySnip').onclick = e => need() && copy(snippet(), e.target);
$('addList').onclick = () => { if (need()) { $('list').value += snippet() + '\n'; map.addMarker(sel.x, sel.z, '#ffffff', 'New place'); } };
$('copyList').onclick = e => copy($('list').value, e.target);
$('zin').onclick = () => map.zoomBy(1.5);
$('zout').onclick = () => map.zoomBy(1 / 1.5);
$('reset').onclick = () => map.fit(true);
</script>
</body></html>
